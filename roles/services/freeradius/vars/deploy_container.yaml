freeradius_deployment: container

freeradius_root_user:
  uid: "{{ docker_facts_ns_base_uid | default(0) }}"
  gid: "{{ docker_facts_ns_base_gid | default(0) }}"

freeradius_user:
  uid: "{{ freeradius_root_user.uid + 1024 }}"
  gid: "{{ freeradius_root_user.gid + 1024 }}"

freeradius_ct_base_dir: "{{ docker_facts_root_dir }}/volumes"
freeradius_conf_dir: "{{ freeradius_ct_base_dir }}/{{ freeradius_ctx.deployment.volume.conf }}/_data"

freeradius_dir:
  data: "{{ freeradius_ct_base_dir }}/{{
    '%s/_data' % (freeradius_ctx.deployment.volume.data)
    if freeradius_ctx.deployment.volume.data is defined
    else none }}"
  cache: "{{ freeradius_ct_base_dir }}/{{
    '%s/_data' % (freeradius_ctx.deployment.volume.cache)
    if freeradius_ctx.deployment.volume.cache is defined
    else none }}"
  logs: "{{ freeradius_ct_base_dir }}/{{ freeradius_ctx.deployment.volume.logs }}/_data"
