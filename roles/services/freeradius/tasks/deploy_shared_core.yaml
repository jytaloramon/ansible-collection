- name: Create configuration directory
  ansible.builtin.file:
    path: "{{ freeradius_conf_dir }}"
    state: directory
    owner: "{{ freeradius_root_user.uid }}"
    group: "{{ freeradius_user.gid }}"
    mode: "0750"

- name: Create directory
  ansible.builtin.file:
    path: "{{ dir }}"
    state: directory
    owner: "{{ freeradius_user.uid }}"
    group: "{{ freeradius_user.gid }}"
    mode: "0750"
  loop: "{{
    [freeradius_dir.data,
    freeradius_dir.cache,
    freeradius_dir.logs]
    | select }}"
  loop_control:
    loop_var: dir
    label: "{{ dir }}"

- name: Deploy instance TXT
  ansible.builtin.copy:
    dest: "{{ freeradius_conf_dir }}/instance.txt"
    content: "name: {{ freeradius_ctx.name }}\n"
    owner: "{{ freeradius_root_user.uid }}"
    group: "{{ freeradius_root_user.gid }}"
    mode: "0644"

- name: Deploy log rotation configuration
  ansible.builtin.template:
    src: templates/logrotate.j2
    dest: "/etc/logrotate.d/freeradius{{ '.%s' % (freeradius_ctx.name) if freeradius_deployment == 'container' }}"
    owner: root
    group: root
    mode: "0644"
