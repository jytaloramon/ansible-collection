- name: Install packages
  ansible.builtin.dnf:
    name:
      - "freeradius{{ freeradius_ctx.pkg_version | default('') }}"
      - "freeradius-krb5{{ freeradius_ctx.pkg_version | default('') }}"
      - "freeradius-ldap{{ freeradius_ctx.pkg_version | default('') }}"
      - "freeradius-python{{ freeradius_ctx.pkg_version | default('') }}"
      - "freeradius-rest{{ freeradius_ctx.pkg_version | default('') }}"
      - "freeradius-utils{{ freeradius_ctx.pkg_version | default('') }}"
    state: present

- name: Set RedHat facts
  ansible.builtin.set_fact:
    freeradius_service_name: radiusd
    freeradius_default_user: radiusd

- name: Stat /etc/raddb
  ansible.builtin.stat:
    path: /etc/raddb
  register: freeradius_default_dir_stat

- name: Rename configuration directory
  when: freeradius_default_dir_stat.stat.exists
  ansible.builtin.command:
    cmd: "mv /etc/raddb {{ freeradius_instance.dir.conf }}"
  changed_when: true
