- name: Set context facts
  ansible.builtin.set_fact:
    freeradius_ctx: "{{ freeradius_ct }}"

- name: Includes a task to load context variables
  ansible.builtin.import_tasks: include_context_vars.yaml

- name: Set instance facts
  ansible.builtin.set_fact:
    freeradius_instance:
      deployment: container
      dir:
        conf: "{{ docker_facts_root_dir }}/volumes/{{ freeradius_ctx.deployment.volume.conf }}/_data"
        data: "{{
          '{}/volumes/{}/_data'.format(docker_facts_root_dir, freeradius_ctx.deployment.volume.data)
          if freeradius_ctx.deployment.volume.data is defined
          else none }}"
        cache: "{{
          '{}/volumes/{}/_data'.format(docker_facts_root_dir, freeradius_ctx.deployment.volume.cache)
          if freeradius_ctx.deployment.volume.cache is defined
          else none }}"
        logs: "{{ docker_facts_root_dir }}/volumes/{{ freeradius_ctx.deployment.volume.logs }}/_data"
      root:
        uid: "{{ docker_facts_ns_base_uid | default(0) }}"
        gid: "{{ docker_facts_ns_base_gid | default(0) }}"
      user:
        uid: "{{ (docker_facts_ns_base_uid | default(0)) + freeradius_user.docker.uid }}"
        gid: "{{ (docker_facts_ns_base_gid | default(0)) + freeradius_user.docker.gid }}"

- name: Create volume
  community.docker.docker_volume:
    volume_name: "{{ vol_name }}"
    driver: local
  loop: "{{
    [freeradius_ctx.deployment.volume.conf,
    freeradius_ctx.deployment.volume.data | default(none),
    freeradius_ctx.deployment.volume.cache | default(none),
    freeradius_ctx.deployment.volume.logs]
    | select }}"
  loop_control:
    loop_var: vol_name
    label: "{{ vol_name }}"

- name: Includes shared tasks
  when: not(freeradius_ctx.deployment.fast_bootstrap | default(false))
  ansible.builtin.import_tasks: deploy_shared_core.yaml

- name: Deploy compose file
  ansible.builtin.template:
    src: "{{ freeradius_ctx.deployment.compose_file }}"
    dest: "/tmp/{{ freeradius_ctx.deployment.stack_name }}.docker-compose.yaml"
    owner: root
    group: root
    mode: "0600"

- name: Deploy Docker Stack
  community.docker.docker_stack:
    name: "{{ freeradius_ctx.deployment.stack_name }}"
    compose: "/tmp/{{ freeradius_ctx.deployment.stack_name }}.docker-compose.yaml"

- name: Remove compose file
  ansible.builtin.file:
    path: "/tmp/{{ freeradius_ctx.deployment.stack_name }}.docker-compose.yaml"
    state: absent
