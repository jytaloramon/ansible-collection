- name: Configure service
  when: ansible_facts.system == "Linux"
  block:
    - name: Set Keys permissions
      ansible.builtin.file:
        path: "{{ ssh_dir.conf }}/{{ filename }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ ssh_keys_filename }}"
      loop_control:
        loop_var: filename
        label: "{{ filename }}"

    - name: Set Public Keys permissions
      ansible.builtin.file:
        path: "{{ ssh_dir.conf }}/{{ filename }}.pub"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ssh_keys_filename }}"
      loop_control:
        loop_var: filename
        label: "{{ filename }}"

    - name: Deploy sshd_config file
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: "{{ ssh_dir.conf }}/sshd_config"
        owner: root
        group: root
        mode: "0644"

    - name: Restart and enable service
      ansible.builtin.service:
        name: ssh
        state: restarted
        enabled: true
