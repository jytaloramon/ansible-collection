- name: Set OS facts
  ansible.builtin.set_fact:
    hostname_os_type: "{{ ansible_facts.system | lower }}"

- name: OS type support check
  ansible.builtin.assert:
    that: hostname_os_type == 'linux'
    success_msg: "Supported OS type."
    fail_msg: "Unsupported OS type: {{ hostname_os_type }}."
    quiet: true

- name: Set local system name
  when: not(hostname_ignore | default(false))
  ansible.builtin.hostname:
    name: "{{ hostname_name }}"
